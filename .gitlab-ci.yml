stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE_NAME: ziyait/ziyaweb

image: docker:20.10.16
services:
  - docker:20.10.16-dind

before_script:
  - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

build_image:
  stage: build
  script:
    - docker build --no-cache -t $DOCKER_IMAGE_NAME:$CI_COMMIT_REF_NAME .
    - docker push $DOCKER_IMAGE_NAME:$CI_COMMIT_REF_NAME
  only:
    - dev
    - staging
    - live

deploy_dev:
  stage: deploy
  only:
    - dev
  script:
    - echo "$STAGING_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan 34.211.227.206 >> ~/.ssh/known_hosts
    - ssh ubuntu@34.211.227.206 "
      docker stop ziyaweb-dev || true &&
      docker rm ziyaweb-dev || true &&
      docker pull $DOCKER_IMAGE_NAME:dev &&
      docker run --name ziyaweb-dev -d -p 5000:5000 $DOCKER_IMAGE_NAME:dev
      "

deploy_staging:
  stage: deploy
  only:
    - staging
  script:
    - echo "$STAGING_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan 34.211.227.206 >> ~/.ssh/known_hosts
    - ssh ubuntu@34.211.227.206 "
      docker stop ziyaweb-staging || true &&
      docker rm ziyaweb-staging || true &&
      docker pull $DOCKER_IMAGE_NAME:staging &&
      docker run --name ziyaweb-staging -d -p 3000:3000 $DOCKER_IMAGE_NAME:staging
      "

deploy_live:
  stage: deploy
  only:
    - live
  script:
    - echo "$LIVE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan 35.163.73.204 >> ~/.ssh/known_hosts
    - ssh ubuntu@35.163.73.204 "
      docker stop ziyaweb || true &&
      docker rm ziyaweb || true &&
      docker pull $DOCKER_IMAGE_NAME:live &&
      docker run --name ziyaweb -d -p 3000:3000 $DOCKER_IMAGE_NAME:live
      "
