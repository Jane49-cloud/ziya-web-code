# .gitlab-ci.yml
image: docker:20.10.16

services:
  - docker:20.10.16-dind

stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE

before_script:
  # 1) Log in to GitLab Container Registry
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build_image:
  stage: build
  script:
    - docker build --no-cache -t $DOCKER_IMAGE:$CI_COMMIT_REF_NAME .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_REF_NAME
  only:
    - dev
    - staging
    - live

.deploy_template: &deploy_template
  stage: deploy
  before_script:
    # Install SSH client
    - apk update && apk add --no-cache openssh-client
    # Prepare SSH dir
    - mkdir -p ~/.ssh
    # Copy the file-type variable exactly into id_rsa
    - cp $SSH_KEY_FILE ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $TARGET_HOST >> ~/.ssh/known_hosts
  script:
    - ssh ubuntu@$TARGET_HOST "
      docker stop $CONTAINER_NAME || true &&
      docker rm $CONTAINER_NAME  || true &&
      docker pull $DOCKER_IMAGE:$CI_COMMIT_REF_NAME &&
      docker run --name $CONTAINER_NAME -d -p $PORT:$PORT $DOCKER_IMAGE:$CI_COMMIT_REF_NAME
      "

deploy_dev:
  <<: *deploy_template
  variables:
    SSH_KEY_FILE: $DEV_SSH_KEY_FILE
    TARGET_HOST: 34.211.227.206
    CONTAINER_NAME: ziyaweb-dev
    PORT: 5000
  only:
    - dev

deploy_staging:
  <<: *deploy_template
  variables:
    SSH_KEY_FILE: $STAGING_SSH_KEY_FILE
    TARGET_HOST: 34.211.227.206
    CONTAINER_NAME: ziyaweb-staging
    PORT: 3000
  only:
    - staging

deploy_live:
  <<: *deploy_template
  variables:
    SSH_KEY_FILE: $LIVE_SSH_KEY_FILE
    TARGET_HOST: 35.163.73.204
    CONTAINER_NAME: ziyaweb
    PORT: 3000
  only:
    - live
