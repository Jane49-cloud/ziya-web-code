image: docker:20.10.16

services:
  - docker:20.10.16-dind

stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  SSH_KEY_B64: $SSH_KEY_B64

before_script:
  # 1. Log in to the GitLab Container Registry
  - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  # 2. Decode & install SSH key for deployment
  - mkdir -p ~/.ssh
  - echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
  - ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts

build:
  stage: build
  script:
    - docker build --no-cache -t "$DOCKER_IMAGE:$CI_COMMIT_REF_NAME" .
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_REF_NAME"
  only:
    - dev
    - staging
    - live

.deploy: &deploy
  stage: deploy
  script:
    - |
      ssh ubuntu@"$TARGET_HOST" << 'EOF'
      docker stop  "$CONTAINER_NAME"  || true
      docker rm    "$CONTAINER_NAME"  || true
      docker pull  "$DOCKER_IMAGE:$CI_COMMIT_REF_NAME"
      docker run --name "$CONTAINER_NAME" -d -p "$PORT":3000 "$DOCKER_IMAGE:$CI_COMMIT_REF_NAME"
      EOF

deploy_dev:
  <<: *deploy
  variables:
    TARGET_HOST: 34.211.227.206
    CONTAINER_NAME: ziyaweb-dev
    PORT: 5000
  only:
    - dev

deploy_staging:
  <<: *deploy
  variables:
    TARGET_HOST: 34.211.227.206
    CONTAINER_NAME: ziyaweb-staging
    PORT: 3000
  only:
    - staging

deploy_live:
  <<: *deploy
  variables:
    TARGET_HOST: 35.163.73.204
    CONTAINER_NAME: ziyaweb
    PORT: 3000
  only:
    - live
