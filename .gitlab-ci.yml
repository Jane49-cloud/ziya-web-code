stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE

before_script:
  - docker --version
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"


build_beta:
  stage: build
  tags:
    - ziya-web
  script:
    - docker build -t "$DOCKER_IMAGE:beta" -t "$DOCKER_IMAGE:beta-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}" .
    - docker push "$DOCKER_IMAGE:beta"
    - docker push "$DOCKER_IMAGE:beta-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
  only:
    - dev

# BUILD: STAGING 

build_staging:
  stage: build
  tags:
    - ziya-web
  script:
    - docker build --no-cache -t "$DOCKER_IMAGE:staging" -t "$DOCKER_IMAGE:staging-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}" .
    - docker push "$DOCKER_IMAGE:staging"
    - docker push "$DOCKER_IMAGE:staging-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
  only:
    - staging


build_live:
  stage: build
  tags:
    - ziya-web
  script:
    - docker build --no-cache -t "$DOCKER_IMAGE:live" -t "$DOCKER_IMAGE:live-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}" .
    - docker push "$DOCKER_IMAGE:live"
    - docker push "$DOCKER_IMAGE:live-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
  only:
    - live

# DEPLOY TEMPLAT


.deploy_template: &deploy_template
  stage: deploy
  tags:
    - ziya-web
  script:
    - |
      set -e

      BACKUP_NAME="${CONTAINER_NAME}-backup-$(date +%Y%m%d%H%M%S)"
      FAILED_NAME="${CONTAINER_NAME}-failed-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}-$(date +%Y%m%d%H%M%S)"
      NEW_IMAGE="${DOCKER_IMAGE}:${IMAGE_TAG}-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"

      echo "Deploying $NEW_IMAGE to $CONTAINER_NAME on port $PORT"

      docker pull "$NEW_IMAGE"

      # Rename and stop current container
      if docker ps -a --format '{{.Names}}' | grep -Fxq "$CONTAINER_NAME"; then
        echo "Backing up existing container: $CONTAINER_NAME -> $BACKUP_NAME"
        docker rename "$CONTAINER_NAME" "$BACKUP_NAME"
        docker stop "$BACKUP_NAME" || true
      fi

      # Start container
      docker run \
        --name "$CONTAINER_NAME" \
        -d \
        --restart unless-stopped \
        -p "$PORT":3000 \
        "$NEW_IMAGE"

      sleep 8

      RUNNING=$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null || echo false)

      if [ "$RUNNING" != "true" ]; then
        echo "New container is not running. Rolling back..."

        docker stop "$CONTAINER_NAME" || true
        docker rename "$CONTAINER_NAME" "$FAILED_NAME" || true

        LAST_BACKUP=$(docker ps -a --format '{{.Names}}' | grep "^${CONTAINER_NAME}-backup-" | sort | tail -n 1 || true)

        if [ -n "$LAST_BACKUP" ]; then
          docker rename "$LAST_BACKUP" "$CONTAINER_NAME"
          docker start "$CONTAINER_NAME"
          echo "Rollback completed using $LAST_BACKUP"
        else
          echo "No backup container found for rollback."
          exit 1
        fi

        exit 1
      fi

      echo "Deployment successful."

      # Keep latest 2  backup containers
      OLD_BACKUPS=$(docker ps -a --format '{{.Names}}' | grep "^${CONTAINER_NAME}-backup-" | sort | head -n -2 || true)

      if [ -n "$OLD_BACKUPS" ]; then
        echo "Removing backup containers older than latest 2:"
        echo "$OLD_BACKUPS"
        echo "$OLD_BACKUPS" | xargs -r docker rm
      fi

      # Keep latest 3 images 
      OLD_IMAGE_TAGS=$(docker image ls "$DOCKER_IMAGE" --format '{{.Tag}}' | grep "^${IMAGE_TAG}-[0-9].*-" | sort -V | head -n -3 || true)

      if [ -n "$OLD_IMAGE_TAGS" ]; then
        echo "Removing local images older than latest 3:"
        echo "$OLD_IMAGE_TAGS"

        echo "$OLD_IMAGE_TAGS" | while read -r OLD_TAG; do
          if [ -n "$OLD_TAG" ]; then
            docker rmi "${DOCKER_IMAGE}:$OLD_TAG" || true
          fi
        done
      fi

      echo "Current running container:"
      docker ps --filter "name=$CONTAINER_NAME"

      echo "Backup containers retained:"
      docker ps -a --filter "name=${CONTAINER_NAME}-backup-"

      echo "Images retained:"
      docker image ls "$DOCKER_IMAGE" | grep "$IMAGE_TAG" || true

# DEPLOY 

deploy_beta:
  <<: *deploy_template
  variables:
    CONTAINER_NAME: ziyaweb-beta
    PORT: 5000
    IMAGE_TAG: beta
  only:
    - dev


deploy_staging:
  <<: *deploy_template
  variables:
    CONTAINER_NAME: ziyaweb-staging
    PORT: 3000
    IMAGE_TAG: staging
  only:
    - staging


deploy_live:
  <<: *deploy_template
  variables:
    CONTAINER_NAME: ziyaweb-live
    PORT: 3001
    IMAGE_TAG: live
  only:
    - live